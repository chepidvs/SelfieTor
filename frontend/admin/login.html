<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SelfieTor Admin — Login</title>
<style>
  :root{--bg:#14110E;--panel:#1F1A15;--border:#3A322A;--text:#EDE7DF;--muted:#A39B8E;--accent:#E8853A;--err:#E27866;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:28px;width:300px}
  h1{font-size:18px;margin:0 0 18px}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
  input{width:100%;background:#272019;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px;font-size:14px;margin-bottom:14px}
  button{width:100%;background:var(--accent);border:0;border-radius:8px;color:#241300;font-weight:600;padding:11px;cursor:pointer;font-size:14px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{font-size:13px;color:var(--err);min-height:18px;margin-top:10px}
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>SelfieTor Admin</h1>
    <label for="password">Password</label>
    <input type="password" id="password" required autofocus>
    <button type="submit" id="btn">Login</button>
    <div class="msg" id="msg"></div>
  </form>

<script>
const API_BASE = '';
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  msg.textContent = '';
  try {
    const res = await fetch(`${API_BASE}/api/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      msg.textContent = data.detail || 'Login gagal';
      btn.disabled = false;
      return;
    }
    window.location.href = '/admin/dashboard';
  } catch (err) {
    msg.textContent = 'Gak bisa connect ke server: ' + err.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
